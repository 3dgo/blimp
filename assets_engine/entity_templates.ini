# Entity templates: the Templates window (Show menu) lists one entry per [entity] block.
# Same block format as a .level and the clipboard; fields left out take their schema default.
# icon is a hex Material Symbols codepoint; lights and cameras don't need one. Adding a template
# keeps its rotation and scale and drops it at the paste point. Not a level (wrong extension), so
# the Worlds window doesn't list it.

[entity]
name = empty
icon = E835

[entity]
name = marker
icon = E153

[entity]
name = point_light
light_type = Point
range = 0.1, 5

[entity]
name = point_light_shadow
light_type = Point
range = 0.1, 5
shadow = true

[entity]
name = spot_light
rotation = 0.70710677, 0, 0, 0.70710677
light_type = Spot
fov = 45
inner_fov = 30
range = 0.1, 8

[entity]
name = spot_light_shadow
rotation = 0.70710677, 0, 0, 0.70710677
light_type = Spot
fov = 45
inner_fov = 30
range = 0.1, 8
shadow = true

[entity]
name = cylinder_light
rotation = 0.70710677, 0, 0, 0.70710677
light_type = Cylinder
range = 0.1, 8

[entity]
name = sun
rotation = 0.3536, 0.3536, -0.1464, 0.8536
light_type = Directional
shadow = true

[entity]
name = camera
camera_type = Perspective
fov = 55
range = 0.1, 100

[entity]
name = ortho_camera
camera_type = Orthographic
range = 0.1, 100
