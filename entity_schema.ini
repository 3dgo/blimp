# Entity schema — the source of truth for the Entity struct.
# Build time: codegen emits src/gen_entity.odin (the struct, defaults and EN/ZH labels); nothing reads
# this file at run time. Edited by the in-engine schema editor, which rewrites it whole, so explain things
# in "note" lines, not comments. Section order = struct/member order.
#
# Grammar — INI with TOML-style dotted sections. Every declaration is a [qualified.name]
# section followed by "key = value" attribute lines:
#
#   [field.<id>]                 type / en / zh / tip_en / tip_zh / when + when_en + when_zh (repeated)
#                                / default / tags / section / builtin / note
#   [enum.<T>] / [flags.<T>]     a type (note);  [enum.<T>.<member>]   -> en / zh / tip_en / tip_zh / note
#   [struct.<T>]                 a type (note);  [struct.<T>.<member>] -> type / en / zh / default / note
#
# Types: scalars (bool, i32, u32, f32, string, vec2, vec3, vec4, quat), owned inline text
# (sbuf64 / sbuf128 / sbuf256), the builtin-only Entity_Handle, and qualified refs to authored
# types: enum.<T> / flags.<T> /
# struct.<T>. A dot means the same thing in a header and in a type = reference.
#
# section = a member of enum.EntitySection: the inspector section the field is drawn under
# (sections in the enum's member order; fields without one go first, above them).
# tags = how the inspector treats the field: hidden / readonly / noserialize / identity, and widget:<kind>
# (model, texture, sound for string; icon for sbuf*; color, linear_color for vec3). Set in the schema editor.
# tip_en / tip_zh = the inspector's tooltip: on a field, what it is whatever it's used for; on an enum or flags
# member, what that choice does (shown on its dropdown item or checkbox).
# when = a condition under which the field does something, with when_en / when_zh (both required) on the
# next lines saying what. Repeat the three for each use. Terms joined by &, each <field> (set: non-empty,
# non-zero, not the first enum member) or <field>=<A>|<B> (an enum that is one of them, flags with one of
# them set). A field with "when" lines does something only while one holds (the inspector's dot); without, always.
# note = what it's for, one line, for programmers; codegen writes it as a comment beside the declaration.


#================================ Fields ================================

[field.handle]
type    = Entity_Handle
builtin = true
tags    = hidden, noserialize

[field.selected]
type    = bool
builtin = true
tags    = hidden, noserialize
note    = Editor selection. On the entity so undo snapshots carry it and delete/paste need no bookkeeping; never saved or copied (noserialize), never shown (hidden). (editor_selection.odin, editor_world.odin)

[field.name]
type    = sbuf64
builtin = true
tags    = identity
en      = Name
zh      = 名称

[field.icon]
type    = sbuf64
builtin = true
tags    = widget:icon
en      = Icon
zh      = 图标
tip_en  = Editor icon in the entity lists: a Material Symbols codepoint in hex (e.g. E835). Empty: a light or camera shows its type's icon, anything else none.
tip_zh  = 实体列表中的编辑器图标：Material Symbols 字形的十六进制码位（如 E835）。留空：灯光或相机显示其类型的图标，其他实体不显示。
note    = Editor icon in the entity and template lists: the hex codepoint of a Material Symbols glyph (e.g. E835; the codepoints are in Google's .codepoints list, as in editor_icons.odin). Empty: a light or camera shows its type's icon, anything else none.

[field.basic_static_flags]
type    = flags.EntityBasicStaticFlag
builtin = true
en      = Static Flags
zh      = 静态标志
tip_en  = What the entity is in the static world: whether it moves, draws and bakes.
tip_zh  = 实体在静态世界中的角色：是否移动、绘制和参与烘焙。
default = Static, Renderable, Cast_Indirect

[field.basic_flags]
type    = flags.EntityBasicFlag
builtin = true
en      = Flags
zh      = 基本标志
tip_en  = Whether the game and the editor see the entity.
tip_zh  = 游戏和编辑器是否处理该实体。
default = Enabled

[field.position]
type    = vec3
builtin = true
section = Transform
en      = Position
zh      = 位置
default = 0, 0, 0

[field.rotation]
type    = quat
builtin = true
section = Transform
en      = Rotation
zh      = 旋转
default = 0, 0, 0, 1

[field.scale]
type    = vec3
builtin = true
section = Transform
en      = Scale
zh      = 缩放
default = 1, 1, 1

[field.model]
type    = string
builtin = true
tags    = widget:model
section = Render
en      = Model
zh      = 模型
tip_en  = The model the entity draws and collides as.
tip_zh  = 实体绘制和碰撞所用的模型。
when    = model
when_en = Drawn, and with Collision, collided as in play mode.
when_zh = 会被绘制；设置了碰撞时，在游戏模式中参与碰撞。

[field.anim]
type    = sbuf64
builtin = true
section = Render
en      = Animation
zh      = 动画
when    = model
when_en = A clip of the model's skeleton (its short name, e.g. Walk), looped in play mode while the script outputs no pose. Empty: the rest pose.
when_zh = 模型骨骼的动画片段（短名，如 Walk），在游戏模式下脚本未输出姿势时循环播放。留空：静止姿势。
note    = A clip of the model's skeleton (its short name, e.g. Walk) the entity loops while playing when its script outputs no pose (claude/animation.md). Empty: the rest pose.

[field.shading]
type    = enum.EntityShading
builtin = true
section = Render
en      = Shading
zh      = 着色
when    = model
when_en = How the model's surfaces take light. Default: the level's (World Settings > Shading).
when_zh = 模型表面的受光方式。默认：使用关卡设置（世界设置 > 着色）。
default = Default
note    = How the model's surfaces take light (the ShadingModel members; shading.slang). Default: the level's World Settings → Shading.

[field.blend]
type    = enum.EntityBlend
builtin = true
section = Render
en      = Blend
zh      = 混合
when    = model
when_en = How the model's pixels combine with what's behind them. Alpha and Additive don't write depth or cast shadows, and draw after everything opaque.
when_zh = 模型像素与其背后内容的混合方式。Alpha 与叠加不写入深度、不投射阴影，并在所有不透明物体之后绘制。
default = Opaque
note    = How the model's pixels combine with what's behind them. Alpha and Additive don't write depth or cast shadows, and draw after everything opaque in entity order, unsorted.

[field.camera_type]
type    = enum.EntityCameraType
builtin = true
section = Camera_Light
en      = Camera
zh      = 相机
tip_en  = Makes the entity a camera. A camera and a light are two entities.
tip_zh  = 使实体成为相机。相机和灯光需分为两个实体。
when    = camera_type
when_en = A camera: renders the view from its position, looking down its +Z.
when_zh = 相机：从其位置沿 +Z 方向渲染视图。
default = None
note    = Camera and light, flat on the entity. A kind is which type is set; the shared fields mean what they mean for that kind. Something that needs both (a flashlight on a camera) is two entities. No aspect: a camera takes it from the target it renders into, and shadow maps are square.

[field.light_type]
type    = enum.EntityLightType
builtin = true
section = Camera_Light
en      = Light
zh      = 灯光
tip_en  = Makes the entity a light. A camera and a light are two entities.
tip_zh  = 使实体成为灯光。相机和灯光需分为两个实体。
when    = light_type
when_en = A light: lights the scene, live and in the probe bake.
when_zh = 灯光：照亮场景，包括实时光照与探针烘焙。
default = None

[field.color]
type    = vec3
builtin = true
tags    = widget:linear_color
section = Render
en      = Color
zh      = 颜色
tip_en  = Stored linear; the picker shows and edits it as sRGB.
tip_zh  = 以线性值存储；取色器以 sRGB 显示和编辑。
when    = model
when_en = Tint: multiplies the model's colour and its glow (emissive), scaled by Intensity.
when_zh = 色调：乘到模型颜色和它的自发光上，并按强度缩放。
when    = light_type
when_en = The light's colour.
when_zh = 灯光的颜色。
default = 1, 1, 1
note    = Model tint or light colour, stored linear; the picker shows and edits it as sRGB (like Unity's).

[field.intensity]
type    = f32
builtin = true
section = Render
en      = Intensity
zh      = 强度
when    = model
when_en = Scales the tint: Color x Intensity (white x 1 = as authored).
when_zh = 缩放色调：颜色 x 强度（白色 x 1 = 原样）。
when    = light_type
when_en = Brightness. With Inverse Square falloff, the light at 1 unit away.
when_zh = 亮度。平方反比衰减时为 1 单位距离处的光照。
default = 1

[field.fov]
type    = f32
builtin = true
section = Dimensions
en      = FOV
zh      = 视角
tip_en  = Degrees.
tip_zh  = 单位为度。
when    = camera_type=Perspective
when_en = Vertical field of view.
when_zh = 垂直视野角。
when    = light_type=Spot
when_en = Cone angle, also its shadow frustum.
when_zh = 光锥角度，也是其阴影视锥。
default = 60
note    = Degrees. Perspective camera: vertical field of view. Spot light: cone angle (also its shadow frustum).

[field.inner_fov]
type    = f32
builtin = true
section = Dimensions
en      = Inner FOV
zh      = 内视角
tip_en  = Degrees.
tip_zh  = 单位为度。
when    = light_type=Spot
when_en = Inner cone angle: full intensity inside it, fading to zero at FOV. Clamped to FOV.
when_zh = 内锥角：其内为全强度，向 FOV 渐变为零。不超过 FOV。
default = 40
note    = Degrees. Spot light: inner cone angle — full intensity inside it, fading to zero at fov (Unity's inner spot angle; Unreal's inner cone angle, but as a full angle). Clamped to fov.

[field.radius]
type    = f32
builtin = true
section = Dimensions
en      = Radius
zh      = 半径
when    = light_type=Cylinder
when_en = Beam radius: parallel rays from a disc along the entity's +Z, fading to zero at the radius. Also the shadow's width.
when_zh = 光束半径：从圆盘沿实体 +Z 方向发出的平行光，在半径处衰减为零。也是阴影的宽度。
default = 1
note    = Cylinder light: a spot light with a cylinder-shaped beam instead of a cone. Parallel rays from a disc at the entity along its +Z; radius is the beam's, full intensity inside inner_radius and fading to zero at radius (as fov / inner_fov do for a spot). Inner is clamped to radius.

[field.inner_radius]
type    = f32
builtin = true
section = Dimensions
en      = Inner Radius
zh      = 内半径
when    = light_type=Cylinder
when_en = Full intensity inside it, fading to zero at Radius. Clamped to Radius.
when_zh = 其内为全强度，向半径处渐变为零。不超过半径。
default = 0.75

[field.falloff]
type    = enum.EntityLightFalloff
builtin = true
section = Camera_Light
en      = Falloff
zh      = 衰减
when    = light_type=Point|Spot|Cylinder
when_en = How the light fades over Range.
when_zh = 灯光在范围内的衰减方式。
default = Inverse_Square
note    = How a point / spot / cylinder light fades over its range (see range).

[field.volume_type]
type    = enum.EntityVolumeType
builtin = true
section = Dimensions
en      = Volume
zh      = 体积
tip_en  = Makes the entity a box that game code asks about (Entity.contains), like a trigger.
tip_zh  = 使实体成为一个供游戏代码查询的盒子（实体.包含），如触发区。
when    = volume_type
when_en = A volume: the box Size covers, centred on the entity and turned with it.
when_zh = 体积：Size 覆盖的盒子，以实体为中心，随实体旋转。
default = None
note    = A box in the level that game code asks about, flat on the entity like camera_type and light_type: its box is size, centred on the entity and turned with it (scale doesn't apply). Trigger: Lua asks Entity.contains(volume, point) each update; nothing fires by itself.

[field.size]
type    = vec3
builtin = true
section = Dimensions
en      = Size
zh      = 尺寸
when    = camera_type=Orthographic
when_en = y = view height; the width comes from the target's aspect.
when_zh = y = 视图高度；宽度由渲染目标的宽高比决定。
when    = light_type=Directional
when_en = x, y = shadow area, z = its depth.
when_zh = x、y = 阴影区域，z = 阴影深度。
when    = volume_type
when_en = The volume's box, centred on the entity.
when_zh = 体积的盒子，以实体为中心。
default = 10, 10, 50
note    = The box the entity's projection or volume covers. Orthographic camera: y = view height (the width comes from the target's aspect). Directional light: x, y = shadow area, z = its depth. Volume: the whole box, centred on the entity. Later: fog and other volumes.

[field.range]
type    = vec2
builtin = true
section = Dimensions
en      = Range
zh      = 范围
tip_en  = Near, far (x, y).
tip_zh  = 近、远（x、y）。
when    = camera_type
when_en = Clip planes.
when_zh = 裁剪面。
when    = light_type=Point|Spot|Cylinder
when_en = Falloff: zero at y. Linear and Smooth are full inside x; Inverse Square is held flat inside x (the source's radius). A cylinder measures along its beam. y is also the shadow's far plane.
when_zh = 衰减：在 y 处为零。线性与平滑在 x 内为全强度；平方反比在 x 内保持不变（光源半径）。圆柱光沿光束方向计算距离。y 也是阴影的远平面。
when    = sound&sound_flags=Positional
when_en = Full volume within x, fading linearly to silent at y.
when_zh = x 内为全音量，到 y 线性衰减至静音。
default = 0.1, 20
note    = Near, far. Camera: clip planes. Point / spot / cylinder light: inner, outer distance of its falloff — zero at y. Linear and Smooth are full intensity inside x. Inverse Square is intensity / d² (intensity is the light at 1 unit), held flat inside x (the source's radius) and windowed to zero at y. A cylinder's distance is along its beam, from its disc.

[field.shadow]
type    = bool
builtin = true
section = Camera_Light
en      = Cast Shadow
zh      = 投射阴影
when    = light_type
when_en = Casts shadows, in realtime and in the probe bake.
when_zh = 投射阴影，包括实时阴影与探针烘焙。
default = false

[field.shadow_cull_near]
type    = f32
builtin = true
section = Camera_Light
en      = Shadow Cull Near
zh      = 阴影近处剔除
tip_en  = Anything closer to the light than this casts no shadow from it, like the shade around a lamp's bulb. Other lights still see it as a caster.
tip_zh  = 离灯光比这更近的物体不会挡住这盏灯的光，比如灯泡周围的灯罩。其他灯光仍然会被它遮挡。
when    = shadow&light_type=Point|Spot|Cylinder
when_en = Metres from the light (a cylinder: along its beam from the disc) within which nothing casts its shadow, in realtime and in the bake.
when_zh = 离灯光多少米以内的物体不投射它的阴影（圆柱光沿光束从圆盘算起），实时阴影与烘焙都一样。
default = 0.05
note    = The near plane of a point / spot light's shadow cameras (at least SHADOW_NEAR), where a cylinder's shadow box starts along its beam, and how far short of the light the bake's shadow rays stop. A point light's six near planes cut out a cube of this half-size; the bake's rays a sphere. For a light inside its fixture: past the shade, the fixture stops shadowing its own light without excluding it from any other light's shadows (no light linking).

[field.light_group]
type    = i32
builtin = true
section = Camera_Light
en      = Light Group
zh      = 光源组
when    = light_type
when_en = Light group (World Settings > Light Groups): 0 = static, always on; 1-4 can be dimmed or switched off at runtime (Lua World.set_light_group).
when_zh = 所属光源组（世界设置 > 光源组）：0 = 静态，始终开启；1-4 可在运行时调暗或关闭（Lua World.set_light_group）。
when    = model
when_en = The group the model's glow (emissive) follows: dimmed, switched off and flickering with the group's lights, on screen and in the bake. 0 = always on.
when_zh = 模型自发光所跟随的光源组：随该组灯光一起调暗、关闭和闪烁，屏幕上与烘焙中都一样。0 = 始终开启。
default = 0
note    = Which light group the light belongs to (World Settings → Light Groups): 0 = static, always on; 1–4 can be dimmed or switched off at runtime (Lua World.set_light_group), realtime and baked light together. On a model, the group its emissive follows the same way (lamp glass with its lamp).

[field.indirect]
type    = f32
builtin = true
section = Camera_Light
en      = Indirect Intensity
zh      = 间接光强度
when    = light_type&basic_static_flags=Static&basic_static_flags=Cast_Indirect
when_en = Scales its baked bounce (the probes) without touching its direct light.
when_zh = 缩放其烘焙的反弹光（探针），不影响直接光。
default = 1
note    = Light: scales its baked bounce (the probes) without touching its direct light. Whether it bakes at all is Static + Cast Indirect in its static flags, as for geometry.

[field.halo]
type    = f32
builtin = true
section = Camera_Light
en      = Halo Intensity
zh      = 光晕强度
when    = light_type=Point|Spot
when_en = Scales its glow in the fog (World Settings > Fog > Lamp Halos) without touching its light on surfaces. 0 = no halo.
when_zh = 缩放其在雾中的光晕（世界设置 > 雾 > 灯光光晕），不影响表面光照。0 = 无光晕。
default = 1
note    = Point / spot light: scales the glow it makes in the fog (World Settings → Fog → Lamp Halos), without touching its light on surfaces. 0 = no halo.

[field.sound]
type    = string
builtin = true
tags    = widget:sound
section = Sound
en      = Sound
zh      = 声音
tip_en  = A sound file (.wav .ogg .mp3 .flac under assets/). It plays in play mode, on start with Play On Start or when Lua calls Entity.play_sound, and follows the entity.
tip_zh  = 声音文件（assets/ 下的 .wav .ogg .mp3 .flac）。在游戏模式中播放：勾选开始时播放则在开始时播放，或由 Lua 调用 Entity.play_sound；播放时跟随实体。
when    = sound
when_en = Plays in play mode (Play On Start, or Lua Entity.play_sound) and follows the entity.
when_zh = 在游戏模式中播放（开始时播放，或由 Lua 调用 Entity.play_sound），并跟随实体。
note    = Sound (world_sound.odin): a sound file's project path (.wav .ogg .mp3 .flac under assets/, loaded at startup). The entity plays it in play mode: when the game starts if Play On Start, or when Lua calls Entity.play_sound. While it plays it follows the entity. Positional: full volume within range.x, fading linearly to silent at range.y; otherwise the same everywhere (music, UI).

[field.volume]
type    = f32
builtin = true
section = Sound
en      = Volume
zh      = 音量
when    = sound
when_en = Playback volume (1 = as recorded).
when_zh = 播放音量（1 = 原始音量）。
default = 1

[field.sound_flags]
type    = flags.EntitySoundFlag
builtin = true
section = Sound
en      = Sound Flags
zh      = 声音标志
when    = sound
when_en = How the sound plays.
when_zh = 声音的播放方式。
default = Positional

[field.collision]
type    = enum.EntityCollision
builtin = true
section = Physics
en      = Collision
zh      = 碰撞
when    = model
when_en = What it collides as in play mode. Static entities are static bodies; others follow the entity (kinematic).
when_zh = 游戏模式中的碰撞形状。静态实体为静态刚体；其他实体跟随实体移动（运动学）。
default = Render_Mesh
note    = What the entity collides as while playing (world_physics.odin; claude/gameplay.md → Physics), cheapest first. Box: the model's bounds. Collision Mesh: the kit's <model>_col mesh, authored in the DCC (Play warns when the model has none). Render Mesh (the default): the model's own triangles, every one of them. Static entities are static bodies; anything else follows its entity every frame (kinematic), so a gate a script moves still blocks. Needs a model.

[field.velocity]
type    = vec3
tags    = noserialize
section = Physics
en      = Velocity
zh      = 速度
tip_en  = Metres per second, for game code: Lua reads and writes it. Nothing in the engine moves an entity by it.
tip_zh  = 米/秒，供游戏代码使用：由 Lua 读写。引擎本身不会用它移动实体。
default = 0, 0, 0
note    = Metres per second, for game code: Lua reads and writes it (a character's fall and jump speed between frames, since Lua keeps no state). Nothing in the engine moves an entity by it.

#================================ Enums ================================

[enum.EntitySection]
builtin = true

[enum.EntitySection.Transform]
en      = Transform
zh      = 变换

[enum.EntitySection.Render]
en      = Render
zh      = 渲染

[enum.EntitySection.Dimensions]
en      = Dimensions
zh      = 尺度

[enum.EntitySection.Camera_Light]
en      = Camera & Light
zh      = 相机与灯光

[enum.EntitySection.Sound]
en      = Sound
zh      = 声音

[enum.EntitySection.Physics]
en      = Physics
zh      = 物理

[enum.EntityCollision]
builtin = true

[enum.EntityCollision.None]
en      = None
zh      = 无
tip_en  = Doesn't collide.
tip_zh  = 不参与碰撞。

[enum.EntityCollision.Box]
en      = Box
zh      = 包围盒
tip_en  = The model's bounding box: the cheapest.
tip_zh  = 模型的包围盒：开销最低。

[enum.EntityCollision.Collision_Mesh]
en      = Collision Mesh (_col)
zh      = 碰撞网格（_col）
tip_en  = The kit's <model>_col mesh, authored in the DCC. Play warns when the model has none.
tip_zh  = 套件中的 <model>_col 网格，在建模软件中制作。模型没有时，进入游戏会给出警告。

[enum.EntityCollision.Render_Mesh]
en      = Render Mesh
zh      = 渲染网格
tip_en  = Every triangle of the model itself: exact, and the most expensive.
tip_zh  = 模型自身的全部三角形：最精确，开销最高。

[enum.EntityCameraType]
builtin = true

[enum.EntityCameraType.None]
en      = None
zh      = 无
tip_en  = Not a camera.
tip_zh  = 不是相机。

[enum.EntityCameraType.Perspective]
en      = Perspective
zh      = 透视
tip_en  = Things shrink with distance. FOV is the vertical field of view; Range the clip planes.
tip_zh  = 近大远小。FOV 为垂直视野角；范围为裁剪面。

[enum.EntityCameraType.Orthographic]
en      = Orthographic
zh      = 正交
tip_en  = No perspective: things keep their size at any distance. Size.y is the view height; Range the clip planes.
tip_zh  = 无透视：物体大小不随距离变化。Size.y 为视图高度；范围为裁剪面。

[enum.EntityLightType]
builtin = true

[enum.EntityLightType.None]
en      = None
zh      = 无
tip_en  = Not a light.
tip_zh  = 不是灯光。

[enum.EntityLightType.Directional]
en      = Directional
zh      = 平行光
tip_en  = Parallel light from far away, like the sun, along the entity's +Z. Lights everything; its shadow covers the box set by Size.
tip_zh  = 来自远处的平行光（如太阳），沿实体 +Z 方向。照亮所有物体；阴影覆盖 Size 设定的范围。

[enum.EntityLightType.Point]
en      = Point
zh      = 点光源
tip_en  = Shines in every direction from the entity, fading over Range.
tip_zh  = 从实体向所有方向发光，在范围内衰减。

[enum.EntityLightType.Spot]
en      = Spot
zh      = 聚光灯
tip_en  = A cone along the entity's +Z: FOV wide, full inside Inner FOV, fading over Range.
tip_zh  = 沿实体 +Z 方向的光锥：宽度为 FOV，Inner FOV 内为全强度，在范围内衰减。

[enum.EntityLightType.Cylinder]
en      = Cylinder
zh      = 圆柱光
tip_en  = A beam of parallel rays from a disc along the entity's +Z: Radius wide, full inside Inner Radius, fading over Range.
tip_zh  = 从圆盘沿实体 +Z 方向发出的平行光束：宽度为半径，内半径内为全强度，在范围内衰减。

[enum.EntityVolumeType]
builtin = true

[enum.EntityVolumeType.None]
en      = None
zh      = 无
tip_en  = Not a volume.
tip_zh  = 不是体积。

[enum.EntityVolumeType.Trigger]
en      = Trigger
zh      = 触发区
tip_en  = A box game code checks things against: a script asks Entity.contains(volume, point) each update, to switch levels, open a door, start a sound.
tip_zh  = 供游戏代码检测的盒子：脚本每次更新用 实体.包含(体积, 点) 来问，用来切换关卡、开门、放声音。

[enum.EntityLightFalloff]
builtin = true

[enum.EntityLightFalloff.Inverse_Square]
en      = Inverse Square
zh      = 平方反比
tip_en  = Physical: intensity / d², windowed to zero at range.y. Intensity is the light at 1 unit away.
tip_zh  = 物理衰减：强度 / d²，在 range.y 处收为零。强度为 1 单位距离处的光照。
note    = Physical: intensity / d², windowed to zero at range.y (Unreal, Unity URP).

[enum.EntityLightFalloff.Linear]
en      = Linear
zh      = 线性
tip_en  = Full inside range.x, falling in a straight line to zero at range.y.
tip_zh  = range.x 内为全强度，到 range.y 线性降为零。
note    = Full inside range.x, straight down to zero at range.y.

[enum.EntityLightFalloff.Smooth]
en      = Smooth
zh      = 平滑
tip_en  = Full inside range.x, easing to zero at range.y: no visible edge at either end.
tip_zh  = range.x 内为全强度，到 range.y 平滑降为零：两端都没有明显边缘。
note    = Full inside range.x, smoothstep down to zero at range.y: no visible edge at either end.

[enum.ShadingModel]
builtin = true
note    = A level's shading (World Settings) and what an entity's shading resolves to. Cheapest first; member order is SHADING_* in shading.slang.

[enum.ShadingModel.Unlit]
en      = Unlit
zh      = 无光照
tip_en  = Texture x colour, no light.
tip_zh  = 贴图 x 颜色，不受光照。
note    = Texture × colour, no light.

[enum.ShadingModel.Gouraud]
en      = Gouraud
zh      = 高洛德
tip_en  = Lit per vertex and blended across the face, diffuse only: the PS1 look. Shadows are per pixel.
tip_zh  = 逐顶点光照并在面上插值，仅漫反射：PS1 的效果。阴影为逐像素。
note    = Lit per vertex, interpolated across the face, diffuse only: the PS1's. Shadows per pixel.

[enum.ShadingModel.Lambert]
en      = Lambert
zh      = 兰伯特
tip_en  = Lit per pixel with the mesh's smooth normals, diffuse only: Gouraud without the vertex artifacts.
tip_zh  = 使用网格平滑法线逐像素光照，仅漫反射：没有顶点瑕疵的 Gouraud。
note    = Lit per pixel with the mesh's smooth normals, diffuse only: Gouraud without the vertex artifacts.

[enum.ShadingModel.Flat]
en      = Flat
zh      = 平面
tip_en  = Lit per pixel with each face's own normal, diffuse only: faceted.
tip_zh  = 使用每个面自身的法线逐像素光照，仅漫反射：呈多面体感。
note    = Lit per pixel with the face's normal, diffuse only: faceted.

[enum.ShadingModel.Phong]
en      = Phong
zh      = 冯氏
tip_en  = Lit per pixel, with a specular highlight.
tip_zh  = 逐像素光照，带高光。
note    = Lit per pixel, with a specular highlight.

[enum.EntityShading]
builtin = true
note    = ShadingModel plus Default (the level's).

[enum.EntityShading.Default]
en      = Default
zh      = 默认
tip_en  = The level's shading (World Settings > Shading).
tip_zh  = 使用关卡的着色（世界设置 > 着色）。

[enum.EntityShading.Unlit]
en      = Unlit
zh      = 无光照
tip_en  = Texture x colour, no light.
tip_zh  = 贴图 x 颜色，不受光照。

[enum.EntityShading.Gouraud]
en      = Gouraud
zh      = 高洛德
tip_en  = Lit per vertex and blended across the face, diffuse only: the PS1 look. Shadows are per pixel.
tip_zh  = 逐顶点光照并在面上插值，仅漫反射：PS1 的效果。阴影为逐像素。

[enum.EntityShading.Lambert]
en      = Lambert
zh      = 兰伯特
tip_en  = Lit per pixel with the mesh's smooth normals, diffuse only: Gouraud without the vertex artifacts.
tip_zh  = 使用网格平滑法线逐像素光照，仅漫反射：没有顶点瑕疵的 Gouraud。

[enum.EntityShading.Flat]
en      = Flat
zh      = 平面
tip_en  = Lit per pixel with each face's own normal, diffuse only: faceted.
tip_zh  = 使用每个面自身的法线逐像素光照，仅漫反射：呈多面体感。

[enum.EntityShading.Phong]
en      = Phong
zh      = 冯氏
tip_en  = Lit per pixel, with a specular highlight.
tip_zh  = 逐像素光照，带高光。

[enum.EntityBlend]
builtin = true
note    = Draw order is member order: each is a draw bucket with its own PSO (render_dx.odin).

[enum.EntityBlend.Opaque]
en      = Opaque
zh      = 不透明
tip_en  = Solid: hides what's behind it.
tip_zh  = 不透明：遮挡其后的物体。

[enum.EntityBlend.Cutout]
en      = Cutout
zh      = 镂空
tip_en  = Solid, but pixels under half alpha are cut out (fences, foliage). Shadows still see the whole quad.
tip_zh  = 不透明，但 alpha 低于一半的像素会被裁掉（栅栏、植被）。阴影仍按整个面片投射。
note    = Opaque, but pixels under half alpha are cut out (fences, foliage). Shadows still see the whole quad.

[enum.EntityBlend.Alpha]
en      = Alpha
zh      = 半透明
tip_en  = See-through by the texture's alpha. Doesn't write depth or cast shadows; drawn after everything opaque, unsorted.
tip_zh  = 按贴图 alpha 半透明。不写入深度、不投射阴影；在所有不透明物体之后绘制，不排序。

[enum.EntityBlend.Additive]
en      = Additive
zh      = 叠加
tip_en  = Adds its colour to what's behind it (glows, fire). Doesn't write depth or cast shadows; drawn after everything opaque.
tip_zh  = 将颜色叠加到其后的内容上（光晕、火焰）。不写入深度、不投射阴影；在所有不透明物体之后绘制。


#================================ Flags ================================

[flags.EntityBasicStaticFlag]
builtin = true

[flags.EntityBasicStaticFlag.Static]
en      = Static
zh      = 静态
tip_en  = Never moves: a static physics body, and it can take part in the probe bake. Off: its body follows the entity (kinematic).
tip_zh  = 不会移动：静态物理刚体，并可参与探针烘焙。关闭时：其刚体跟随实体移动（运动学）。

[flags.EntityBasicStaticFlag.Renderable]
en      = Renderable
zh      = 可渲染
tip_en  = Drawn, and pickable in the viewport. A light shines only while this is on.
tip_zh  = 会被绘制，并可在视口中点选。灯光只有开启此项时才会发光。

[flags.EntityBasicStaticFlag.Cast_Indirect]
en      = Cast Indirect
zh      = 投射间接光
tip_en  = With Static: blocks and bounces light in the probe bake. Off for clutter that would only add noise.
tip_zh  = 与静态一起：在探针烘焙中遮挡并反弹光线。对只会增加噪点的杂物请关闭。
note    = Static geometry that blocks and bounces light in the probe bake (claude/rendering.md, Baker). Off for clutter that would only add noise; entities without Static never bake whatever this says.

[flags.EntityBasicFlag]
builtin = true

[flags.EntityBasicFlag.Enabled]
en      = Enabled
zh      = 启用
tip_en  = Off: nothing sees the entity. It isn't drawn, doesn't collide, play sound or animate, and can't be the game camera.
tip_zh  = 关闭时：所有系统都忽略该实体。不绘制、不碰撞、不播放声音、不播放动画，也不能作为游戏相机。

[flags.EntityBasicFlag.Hidden]
en      = Hidden
zh      = 隐藏
tip_en  = Not drawn (in the editor and in game) and not pickable; physics and sound still run. Lua can toggle it.
tip_zh  = 不绘制（编辑器与游戏中均是）且无法点选；物理和声音仍然生效。Lua 可切换此项。

[flags.EntitySoundFlag]
builtin = true

[flags.EntitySoundFlag.Play_On_Start]
en      = Play On Start
zh      = 开始时播放
tip_en  = Plays when the game starts.
tip_zh  = 游戏开始时播放。

[flags.EntitySoundFlag.Loop]
en      = Loop
zh      = 循环
tip_en  = Repeats until stopped.
tip_zh  = 循环播放直到停止。

[flags.EntitySoundFlag.Positional]
en      = Positional
zh      = 空间定位
tip_en  = Fades with distance over Range: full within range.x, silent at range.y. Off: the same everywhere (music, UI).
tip_zh  = 在范围内随距离衰减：range.x 内全音量，range.y 处静音。关闭时：处处音量相同（音乐、界面）。
