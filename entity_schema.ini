# Entity schema — the source of truth for the Entity struct.
# Build time: codegen emits src/gen_entity.odin. Run time: entity_schema.odin loads
# labels/defaults. Edited by the in-engine schema editor. Section order = struct/member order.
#
# Grammar — INI with TOML-style dotted sections. Every declaration is a [qualified.name]
# section followed by "key = value" attribute lines:
#
#   [field.<id>]                 type / en / zh / default / tags / builtin
#   [enum.<T>] / [flags.<T>]     a type;  [enum.<T>.<member>]   -> en / zh
#   [struct.<T>]                 a type;  [struct.<T>.<member>] -> type / en / zh / default
#
# Types: scalars (bool, i32, u32, f32, string, vec2, vec3, vec4, quat), owned inline text
# (sbuf64 / sbuf128 / sbuf256), the builtin-only Entity_Handle, and qualified refs to authored
# types: enum.<T> / flags.<T> /
# struct.<T>. A dot means the same thing in a header and in a type = reference.


#================================ Fields ================================

[field.handle]
type    = Entity_Handle
builtin = true
tags    = hidden, noserialize

# Editor selection. On the entity so undo snapshots carry it and delete/paste need no bookkeeping;
# never saved or copied (noserialize), never shown (hidden). See src/selection.odin.
[field.selected]
type    = bool
builtin = true
tags    = hidden, noserialize

[field.name]
type    = sbuf64
builtin = true
en      = Name
zh      = 名称
tags    = identity

# Editor icon in the entity and template lists: the hex codepoint of a Material Symbols glyph
# (e.g. E835; the codepoints are in Google's .codepoints list, as in editor_icons.odin). Empty: a
# light or camera shows its type's icon, anything else none.
[field.icon]
type    = sbuf64
builtin = true
en      = Icon
zh      = 图标
tags    = widget:icon

[field.basic_static_flags]
type    = flags.EntityBasicStaticFlag
builtin = true
en      = Static Flags
zh      = 静态标志
default = Static, Renderable, Cast_Indirect

[field.basic_flags]
type    = flags.EntityBasicFlag
builtin = true
en      = Flags
zh      = 基本标志
default = Enabled

[field.position]
type    = vec3
builtin = true
en      = Position
zh      = 位置
default = 0, 0, 0
tags    = placement

[field.rotation]
type    = quat
builtin = true
en      = Rotation
zh      = 旋转
default = 0, 0, 0, 1
tags    = placement

[field.scale]
type    = vec3
builtin = true
en      = Scale
zh      = 缩放
default = 1, 1, 1
tags    = placement

[field.model]
type    = string
builtin = true
en      = Model
zh      = 模型
tags    = widget:model

# Camera and light, flat on the entity (CLAUDE.md: fat struct, no components). A kind is which type is
# set; the shared fields mean what they mean for that kind. Something that needs both (a flashlight on
# a camera) is two entities. No aspect: a camera takes it from the target it renders into, and shadow
# maps are square.
[field.camera_type]
type    = enum.EntityCameraType
builtin = true
en      = Camera
zh      = 相机
default = None

[field.light_type]
type    = enum.EntityLightType
builtin = true
en      = Light
zh      = 灯光
default = None

# Light colour, stored linear; the picker shows and edits it as sRGB (like Unity's).
[field.color]
type    = vec3
builtin = true
en      = Color
zh      = 颜色
default = 1, 1, 1
tags    = widget:linear_color

[field.intensity]
type    = f32
builtin = true
en      = Intensity
zh      = 强度
default = 1

# Degrees. Perspective camera: vertical field of view. Spot light: cone angle (also its shadow frustum).
[field.fov]
type    = f32
builtin = true
en      = FOV
zh      = 视角
default = 60

# Degrees. Spot light: inner cone angle — full intensity inside it, fading to zero at fov (Unity's inner
# spot angle; Unreal's inner cone angle, but as a full angle). Clamped to fov.
[field.inner_fov]
type    = f32
builtin = true
en      = Inner FOV
zh      = 内视角
default = 40

# Cylinder light: a spot light with a cylinder-shaped beam instead of a cone. Parallel rays from a disc
# at the entity along its +Z; radius is the beam's, full intensity inside inner_radius and fading to zero
# at radius (as fov / inner_fov do for a spot). Inner is clamped to radius.
[field.radius]
type    = f32
builtin = true
en      = Radius
zh      = 半径
default = 1

[field.inner_radius]
type    = f32
builtin = true
en      = Inner Radius
zh      = 内半径
default = 0.75

# How a point / spot / cylinder light fades over its range (see range).
[field.falloff]
type    = enum.EntityLightFalloff
builtin = true
en      = Falloff
zh      = 衰减
default = Inverse_Square

# The box the entity's projection or volume covers. Orthographic camera: y = view height (the width
# comes from the target's aspect). Directional light: x, y = shadow area, z = its depth. Later: trigger,
# fog and other volumes.
[field.size]
type    = vec3
builtin = true
en      = Size
zh      = 尺寸
default = 10, 10, 50

# Near, far. Camera: clip planes. Point / spot / cylinder light: inner, outer distance of its falloff —
# zero at y. Linear and Smooth are full intensity inside x. Inverse Square is intensity / d² (intensity
# is the light at 1 unit), held flat inside x (the source's radius) and windowed to zero at y. A
# cylinder's distance is along its beam, from its disc.
[field.range]
type    = vec2
builtin = true
en      = Range
zh      = 范围
default = 0.1, 20

[field.shadow]
type    = bool
builtin = true
en      = Cast Shadow
zh      = 投射阴影
default = false

# Which light group the light belongs to (World Settings → Light Groups): 0 = static, always on; 1–4 can be
# dimmed or switched off at runtime (Lua World.set_light_group), realtime and baked light together.
[field.light_group]
type    = i32
builtin = true
en      = Light Group
zh      = 光源组
default = 0


#================================ Enums ================================

[enum.EntityCameraType]
builtin = true

[enum.EntityCameraType.None]
en = None
zh = 无

[enum.EntityCameraType.Perspective]
en = Perspective
zh = 透视

[enum.EntityCameraType.Orthographic]
en = Orthographic
zh = 正交

[enum.EntityLightType]
builtin = true

[enum.EntityLightType.None]
en = None
zh = 无

[enum.EntityLightType.Directional]
en = Directional
zh = 平行光

[enum.EntityLightType.Point]
en = Point
zh = 点光源

[enum.EntityLightType.Spot]
en = Spot
zh = 聚光灯

[enum.EntityLightType.Cylinder]
en = Cylinder
zh = 圆柱光

[enum.EntityLightFalloff]
builtin = true

# Physical: intensity / d², windowed to zero at range.y (Unreal, Unity URP).
[enum.EntityLightFalloff.Inverse_Square]
en = Inverse Square
zh = 平方反比

# Full inside range.x, straight down to zero at range.y.
[enum.EntityLightFalloff.Linear]
en = Linear
zh = 线性

# Full inside range.x, smoothstep down to zero at range.y: no visible edge at either end.
[enum.EntityLightFalloff.Smooth]
en = Smooth
zh = 平滑


#================================ Flags ================================

[flags.EntityBasicStaticFlag]
builtin = true

[flags.EntityBasicStaticFlag.Static]
en = Static
zh = 静态

[flags.EntityBasicStaticFlag.Renderable]
en = Renderable
zh = 可渲染

# Static geometry that blocks and bounces light in the probe bake (docs/rendering.md, Baker). Off for clutter
# that would only add noise; entities without Static never bake whatever this says.
[flags.EntityBasicStaticFlag.Cast_Indirect]
en = Cast Indirect
zh = 投射间接光

[flags.EntityBasicFlag]
builtin = true

[flags.EntityBasicFlag.Enabled]
en = Enabled
zh = 启用

[flags.EntityBasicFlag.Hidden]
en = Hidden
zh = 隐藏
