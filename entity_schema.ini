# Entity schema — the source of truth for the Entity struct.
# Build time: codegen emits src/gen_entity.odin. Run time: entity_schema.odin loads
# labels/defaults. Edited by the in-engine schema editor. Section order = struct/member order.
#
# Grammar — INI with TOML-style dotted sections. Every declaration is a [qualified.name]
# section followed by "key = value" attribute lines:
#
#   [field.<id>]                 type / en / zh / default / tags / builtin
#   [enum.<T>] / [flags.<T>]     a type;  [enum.<T>.<member>]   -> en / zh
#   [struct.<T>]                 a type;  [struct.<T>.<member>] -> type / en / zh / default
#
# Types: scalars (bool, i32, u32, f32, string, vec2, vec3, vec4, quat), owned inline text
# (sbuf64 / sbuf128 / sbuf256), the builtin-only Entity_Handle, and qualified refs to authored
# types: enum.<T> / flags.<T> /
# struct.<T>. A dot means the same thing in a header and in a type = reference.


#================================ Fields ================================

[field.handle]
type    = Entity_Handle
builtin = true
tags    = hidden, noserialize

# Editor selection. On the entity so undo snapshots carry it and delete/paste need no bookkeeping;
# never saved or copied (noserialize), never shown (hidden). See src/selection.odin.
[field.selected]
type    = bool
builtin = true
tags    = hidden, noserialize

[field.name]
type    = sbuf64
builtin = true
en      = Name
zh      = 名称
tags    = identity

[field.basic_static_flags]
type    = flags.EntityBasicStaticFlag
builtin = true
en      = Static Flags
zh      = 静态标志
default = Static, Renderable

[field.basic_flags]
type    = flags.EntityBasicFlag
builtin = true
en      = Flags
zh      = 基本标志
default = Enabled

[field.position]
type    = vec3
builtin = true
en      = Position
zh      = 位置
default = 0, 0, 0
tags    = placement

[field.rotation]
type    = quat
builtin = true
en      = Rotation
zh      = 旋转
default = 0, 0, 0, 1
tags    = placement

[field.scale]
type    = vec3
builtin = true
en      = Scale
zh      = 缩放
default = 1, 1, 1
tags    = placement

[field.model]
type    = string
builtin = true
en      = Model
zh      = 模型
tags    = widget:model

# Camera and light, flat on the entity (CLAUDE.md: fat struct, no components). A kind is which type is
# set; the shared fields mean what they mean for that kind. Something that needs both (a flashlight on
# a camera) is two entities. No aspect: a camera takes it from the target it renders into, and shadow
# maps are square.
[field.camera_type]
type    = enum.EntityCameraType
builtin = true
en      = Camera
zh      = 相机
default = None

[field.light_type]
type    = enum.EntityLightType
builtin = true
en      = Light
zh      = 灯光
default = None

# Light colour (linear).
[field.color]
type    = vec3
builtin = true
en      = Color
zh      = 颜色
default = 1, 1, 1
tags    = widget:color

[field.intensity]
type    = f32
builtin = true
en      = Intensity
zh      = 强度
default = 1

# Degrees. Perspective camera: vertical field of view. Spot light: cone angle (also its shadow frustum).
[field.fov]
type    = f32
builtin = true
en      = FOV
zh      = 视角
default = 60

# The box the entity's projection or volume covers. Orthographic camera: y = view height (the width
# comes from the target's aspect). Directional light: x, y = shadow area, z = its depth. Later: trigger,
# fog and other volumes.
[field.size]
type    = vec3
builtin = true
en      = Size
zh      = 尺寸
default = 10, 10, 50

# Near, far. Camera: clip planes. Point / spot light: shadow near, falloff radius.
[field.range]
type    = vec2
builtin = true
en      = Range
zh      = 范围
default = 0.1, 20

[field.shadow]
type    = bool
builtin = true
en      = Cast Shadow
zh      = 投射阴影
default = false


#================================ Enums ================================

[enum.EntityCameraType]
builtin = true

[enum.EntityCameraType.None]
en = None
zh = 无

[enum.EntityCameraType.Perspective]
en = Perspective
zh = 透视

[enum.EntityCameraType.Orthographic]
en = Orthographic
zh = 正交

[enum.EntityLightType]
builtin = true

[enum.EntityLightType.None]
en = None
zh = 无

[enum.EntityLightType.Directional]
en = Directional
zh = 平行光

[enum.EntityLightType.Point]
en = Point
zh = 点光源

[enum.EntityLightType.Spot]
en = Spot
zh = 聚光灯


#================================ Flags ================================

[flags.EntityBasicStaticFlag]
builtin = true

[flags.EntityBasicStaticFlag.Static]
en = Static
zh = 静态

[flags.EntityBasicStaticFlag.Renderable]
en = Renderable
zh = 可渲染

[flags.EntityBasicFlag]
builtin = true

[flags.EntityBasicFlag.Enabled]
en = Enabled
zh = 启用

[flags.EntityBasicFlag.Hidden]
en = Hidden
zh = 隐藏
